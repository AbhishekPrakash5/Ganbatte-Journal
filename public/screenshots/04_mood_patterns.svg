  <text x="685" y="538" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#4B5563">Your pattern calculations execute strictly against your own authenticated Firestore path (/users/{userId}/entries). No third-party ad networks or aggregate trackers are ever utilized.</text>
