<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgG3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>
    <linearGradient id="mapBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bgG3)" />

  <!-- App Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#FFFDF9" stroke="#FDE68A" stroke-width="1.5" />
  <rect x="40" y="14" width="42" height="42" rx="12" fill="url(#mapBtn)" />
  <text x="61" y="42" font-size="22" text-anchor="middle" dominant-baseline="central">🍥</text>
  <text x="96" y="38" font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="bold" font-size="24" fill="#451A03">Ganbatte Journal</text>
  
  <rect x="290" y="24" width="130" height="24" rx="12" fill="#FEF3C7" stroke="#FCD34D" />
  <circle cx="304" cy="36" r="4" fill="#EA580C" />
  <text x="316" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#78350F">ICHIRAKU RAMEN</text>

  <!-- Title Banner -->
  <text x="40" y="115" font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="bold" font-size="26" fill="#451A03">Geospatial Places Map &amp; Sanctuary Pins</text>
  <text x="40" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#92400E">Explore geotagged reflections mapped across physical environments with vitality-colored chakra markers.</text>

  <!-- Left: Interactive Map Container Simulation -->
  <rect x="42" y="162" width="756" height="480" rx="16" fill="#E2D9CE" opacity="0.4" />
  <rect x="40" y="160" width="760" height="480" rx="16" fill="#E8EEF2" stroke="#CBD5E1" stroke-width="1.5" />

  <!-- Map Grid & Roads -->
  <path d="M40,240 Q300,280 800,250" fill="none" stroke="#FFFFFF" stroke-width="10" opacity="0.7" />
  <path d="M40,420 Q400,380 800,450" fill="none" stroke="#FFFFFF" stroke-width="14" opacity="0.7" />
  <path d="M280,160 Q320,400 300,640" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.7" />
  <path d="M580,160 Q560,400 620,640" fill="none" stroke="#FFFFFF" stroke-width="12" opacity="0.7" />

  <!-- Green Park Zones -->
  <rect x="120" y="270" width="130" height="110" rx="18" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" />
  <text x="185" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="bold" fill="#15803D" text-anchor="middle">🌲 Konoha Forest</text>

  <rect x="420" y="200" width="120" height="90" rx="14" fill="#DCFCE7" stroke="#86EFAC" stroke-width="1.5" />
  <text x="480" y="245" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#15803D" text-anchor="middle">🍃 Training Field</text>

  <!-- Water River -->
  <path d="M40,600 Q300,560 500,580 T800,550" fill="none" stroke="#BAE6FD" stroke-width="26" />
  <text x="400" y="585" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#0284C7">Naka River Sanctuary</text>

  <!-- Pin 1: High Vitality (Green) -->
  <circle cx="185" cy="350" r="16" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
  <text x="185" y="355" font-size="14" text-anchor="middle" fill="#FFFFFF">🍃</text>

  <!-- Pin 2: Active Pin with Popup (Orange - Ichiraku Ramen) -->
  <circle cx="490" cy="360" r="20" fill="#EA580C" stroke="#FFFFFF" stroke-width="4" />
  <text x="490" y="366" font-size="18" text-anchor="middle">🍜</text>

  <!-- Interactive Popup Box -->
  <rect x="400" y="390" width="280" height="130" rx="12" fill="#FFFDF9" stroke="#F59E0B" stroke-width="2" />
  <polygon points="490,380 480,390 500,390" fill="#FFFDF9" stroke="#F59E0B" />
  
  <text x="415" y="415" font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="bold" font-size="15" fill="#451A03">Ichiraku Ramen Stand</text>
  <rect x="585" y="403" width="80" height="18" rx="6" fill="#FEF3C7" />
  <text x="625" y="416" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#EA580C" text-anchor="middle">8.8 / 10</text>
  <text x="415" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350F">"Steaming broth after rigorous sprint."</text>
  <text x="415" y="460" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#059669">Seal: Ichiraku Ramen • Leaf Village</text>
  <rect x="415" y="475" width="250" height="26" rx="6" fill="#EA580C" />
  <text x="540" y="492" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle">View Full Reflection →</text>

  <!-- Pin 3: Reflective/Calm (Amber) -->
  <circle cx="680" cy="280" r="16" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
  <text x="680" y="285" font-size="14" text-anchor="middle" fill="#FFFFFF">🦊</text>

  <!-- Right: Geotagged Locations List Card -->
  <rect x="822" y="162" width="336" height="480" rx="16" fill="#E2D9CE" opacity="0.4" />
  <rect x="820" y="160" width="340" height="480" rx="16" fill="#FFFDF9" stroke="#FDE68A" stroke-width="1.5" />

  <text x="840" y="195" font-family="'Newsreader', Georgia, serif" font-style="italic" font-weight="bold" font-size="18" fill="#451A03">Geotagged Sanctuaries</text>
  <text x="840" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#78350F">Click any entry to pan and inspect:</text>

  <!-- List Item 1 -->
  <rect x="840" y="235" width="300" height="80" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5" />
  <text x="855" y="258" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#451A03">Ichiraku Ramen Stand</text>
  <text x="855" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#EA580C">🍜 Cafe / Eatery • Vitality: 8.8</text>
  <text x="855" y="296" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350F">35.6895° N, 139.6917° E</text>

  <!-- List Item 2 -->
  <rect x="840" y="325" width="300" height="80" rx="10" fill="#FFFBEB" stroke="#FDE68A" />
  <text x="855" y="348" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#451A03">Konoha Forest Canopy</text>
  <text x="855" y="368" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#059669">🌲 Park / Outdoors • Vitality: 9.1</text>
  <text x="855" y="386" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350F">35.6942° N, 139.6830° E</text>

  <!-- List Item 3 -->
  <rect x="840" y="415" width="300" height="80" rx="10" fill="#FFFBEB" stroke="#FDE68A" />
  <text x="855" y="438" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#451A03">Hokage Library Alcove</text>
  <text x="855" y="458" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#D97706">📚 Study / Office • Vitality: 7.4</text>
  <text x="855" y="476" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#78350F">35.6811° N, 139.7022° E</text>

  <!-- Leaflet & Privacy Badge -->
  <rect x="840" y="520" width="300" height="90" rx="10" fill="#F3F4F6" stroke="#E5E7EB" />
  <text x="855" y="545" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="11" fill="#374151">OpenStreetMap &amp; Leaflet Integration</text>
  <text x="855" y="568" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#6B7280">Privacy First: Coordinates are strictly owner-bound to your authenticated subcollection.</text>
</svg>
